name: Manual Robot Runs

on:
  workflow_dispatch:

jobs:
  run-robot:
    name: Run Robot Framework commands
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Robot Framework
        run: |
          python -m pip install --upgrade pip
          pip install robotframework
          pip install  -r  requirements.txt
          mcrypt -d secret.robot.nc

      - name: Run load_excel
        run: python -m robot --include complete load_excel.robot

      - name: Run tt_execute_excel
        run: python -m robot tt_execute_excel.robot
