[pytest]
minversion = 7.0
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    admin: marks tests as admin panel tests
    load: marks tests as data loading tests
    execute: marks tests as test execution tests
    asyncio: marks tests as async tests
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
